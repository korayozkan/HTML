<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metin</title>
</head>

<body>
    <p> <strong>önemli ve kalın (strong)</strong> </p>
    <p> <b>sadece kalın (b)</b></p>

    <p> <em>vurgulu ve eğik (em)</em></p>
    <p> <i>sadece eğik (i)</i> </p>

    <p> <mark>fosforlu / işaretlenmiş (mark)</mark> </p>

    <p>de <del>üstü çizili (del)</del> ve <ins>altı çizili / eklenmiş (ins)</ins> </p>

    <p> H<sub>2</sub>O (subscript)</p>
    <p> 2<sup>10</sup> = 1024 (superscript)</p>

    <p><small>daha küçük (small)</small> </p>

</body>

</html>
